agents:
  queue: "argus"

steps:
  - group: ":test_tube: PR validation"
    key: "pr-validation"
    if: 'build.branch != "main" && build.pull_request.repository.fork != true'
    steps:
      - label: ":rust: Rust"
        key: "rust"
        command: "bash .buildkite/ci.sh rust"
        timeout_in_minutes: 35
        if_changed:
          - "Cargo.toml"
          - "Cargo.lock"
          - "crates/**"
          - "services/**"
          - "migrations/**"
          - ".buildkite/**"

      - label: ":typescript: Web"
        key: "web"
        command: "bash .buildkite/ci.sh web"
        timeout_in_minutes: 25
        if_changed:
          - "apps/web/**"
          - "packages/**"
          - "package.json"
          - "pnpm-lock.yaml"
          - "pnpm-workspace.yaml"
          - ".buildkite/**"

      - label: ":package: Content"
        key: "content"
        command: "bash .buildkite/ci.sh content"
        timeout_in_minutes: 25
        if_changed:
          - "apps/content/**"
          - "packages/**"
          - "package.json"
          - "pnpm-lock.yaml"
          - "pnpm-workspace.yaml"
          - ".buildkite/**"

      - label: ":wrench: Installer"
        key: "installer"
        command: "bash .buildkite/ci.sh installer"
        timeout_in_minutes: 20
        if_changed:
          - "install.sh"
          - "apps/installer/**"
          - "crates/cli/**"
          - "deploy/docker/host-tools.Dockerfile"
          - "package.json"
          - "pnpm-lock.yaml"
          - "pnpm-workspace.yaml"
          - ".buildkite/**"

      - label: ":postgres: Database runtime"
        key: "database-runtime"
        command: "bash .buildkite/ci.sh database"
        timeout_in_minutes: 35
        if_changed:
          - "Cargo.toml"
          - "Cargo.lock"
          - "crates/**"
          - "services/control-api/**"
          - "services/worker/**"
          - ".buildkite/**"

      - label: ":docker: CMS runtime"
        key: "cms-runtime"
        command: "bash .buildkite/ci.sh cms"
        timeout_in_minutes: 35
        if_changed:
          - "apps/content/**"
          - "packages/**"
          - "package.json"
          - "pnpm-lock.yaml"
          - "pnpm-workspace.yaml"
          - "scripts/first-server-content-acceptance.mjs"
          - "scripts/test-native-cms-runtime.sh"
          - "scripts/test-media-runtime.sh"
          - "scripts/test-forms-runtime.sh"
          - "services/control-api/src/job_execution.rs"
          - "services/control-api/migrations/**"
          - ".buildkite/**"

      - label: ":white_check_mark: Acceptance tooling"
        key: "acceptance"
        command: "bash .buildkite/ci.sh acceptance"
        timeout_in_minutes: 25
        if_changed:
          - "install.sh"
          - "crates/cli/**"
          - "scripts/first-server-**"
          - "scripts/reset-first-test.sh"
          - "scripts/test-first-server-**"
          - "scripts/test-reset-first-test.sh"
          - ".buildkite/**"

      - label: ":gear: Deployment lifecycle"
        key: "deployment"
        command: "bash .buildkite/ci.sh deployment"
        timeout_in_minutes: 35
        if_changed:
          - "install.sh"
          - "crates/cli/**"
          - "scripts/first-server-smoke.sh"
          - "scripts/update-first-test.sh"
          - "scripts/recover-interrupted-update.sh"
          - "scripts/registry-login.sh"
          - "scripts/uninstall.sh"
          - "deploy/**"
          - "docker-bake.hcl"
          - ".buildkite/**"

  - group: ":rocket: Main release"
    key: "main-release"
    if: 'build.branch == "main" && build.pull_request.id == null'
    if_changed:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "services/**"
      - "migrations/**"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "install.sh"
      - "scripts/**"
      - "deploy/**"
      - "docker-bake.hcl"
      - ".buildkite/**"
    steps:
      - label: ":lock: Release gate"
        key: "release-gate"
        command: "bash .buildkite/release.sh gate"
        timeout_in_minutes: 20

      - label: ":docker: Build web"
        key: "build-web"
        command: "bash .buildkite/release.sh build web"
        depends_on: "release-gate"
        timeout_in_minutes: 45

      - label: ":docker: Build content"
        key: "build-content"
        command: "bash .buildkite/release.sh build content"
        depends_on: "release-gate"
        timeout_in_minutes: 45

      - label: ":docker: Build control-api"
        key: "build-control-api"
        command: "bash .buildkite/release.sh build control-api"
        depends_on: "release-gate"
        timeout_in_minutes: 45

      - label: ":docker: Build worker"
        key: "build-worker"
        command: "bash .buildkite/release.sh build worker"
        depends_on: "release-gate"
        timeout_in_minutes: 45

      - label: ":docker: Build host-tools"
        key: "build-host-tools"
        command: "bash .buildkite/release.sh build host-tools"
        depends_on: "release-gate"
        timeout_in_minutes: 45

      - label: ":mag: Verify immutable release"
        key: "verify-release"
        command: "bash .buildkite/release.sh verify"
        depends_on:
          - "build-web"
          - "build-content"
          - "build-control-api"
          - "build-worker"
          - "build-host-tools"
        timeout_in_minutes: 15

      - label: ":cloudflare: Deploy installer pages"
        key: "deploy-installer"
        command: "bash .buildkite/release.sh deploy-installer"
        depends_on: "verify-release"
        timeout_in_minutes: 20

      - label: ":arrow_up: Promote release"
        key: "promote-release"
        command: "bash .buildkite/release.sh promote"
        depends_on:
          - "verify-release"
          - "deploy-installer"
        concurrency: 1
        concurrency_group: "argus/main-release-promotion"
        timeout_in_minutes: 20
