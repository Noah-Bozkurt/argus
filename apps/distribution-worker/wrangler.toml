name = "argus-installer"
main = "src/worker.mjs"
compatibility_date = "2025-01-01"

[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_IN_DEPLOYMENT"

[[r2_buckets]]
binding = "RELEASES"
bucket_name = "argus-releases"

[vars]
GITHUB_REPOSITORY = "owner/argus"
GITHUB_REPOSITORY_ID = "0"
SESSION_TTL_SECONDS = "900"
GRANT_TTL_SECONDS = "120"
