[workspace]
resolver = "2"
members = [
  "services/control-api",
  "services/worker",
  "crates/agent",
  "crates/cli",
  "crates/helper",
  "crates/protocol",
  "crates/system",
  "crates/common"
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
console = "0.16.4"
dialoguer = { version = "0.12.0", default-features = false, features = ["password"] }
fs4 = "1.1.0"
hex = "0.4"
indicatif = "0.18.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
sysinfo = "0.31"
tempfile = "3.27.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "time", "process", "sync", "net", "io-util", "fs", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.6.11", features = ["request-id", "trace"] }
utoipa = { version = "5.5.0", features = ["chrono", "uuid"] }
uuid = { version = "1.10", features = ["serde", "v4"] }
