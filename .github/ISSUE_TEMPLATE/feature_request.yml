name: Feature request
description: Propose a focused product or engineering improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operator problem without prescribing a solution first.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What observable result would make this complete?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Include relevant interfaces, workflows, or alternatives if known.
  - type: dropdown
    id: scope
    attributes:
      label: Primary area
      options:
        - Projects and delivery
        - Infrastructure and servers
        - Monitoring and incidents
        - Content platform
        - Authentication and authorization
        - Installer and lifecycle
        - Developer experience
        - Documentation
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and risks
      description: Note security, compatibility, migration, recovery, or operational concerns.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the roadmap.
          required: true
        - label: This request is focused on a concrete problem and outcome.
          required: true
