name: Wire status pages V1
on:
  push:
    branches: [agent/status-pages-v1]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/status-pages-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire store routes and project UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path('services/control-api/src/main.rs')
          text = main.read_text()
          text = text.replace('mod sites_domains;\n', 'mod sites_domains;\nmod status_pages;\n', 1)
          text = text.replace('use sites_domains::SiteDomainStore;\n', 'use sites_domains::SiteDomainStore;\nuse status_pages::StatusPageStore;\n', 1)
          text = text.replace('    sites_domains: SiteDomainStore,\n', '    sites_domains: SiteDomainStore,\n    status_pages: StatusPageStore,\n', 1)
          text = text.replace(
              '    let sites_domains = SiteDomainStore::connect(&config.database_url).await?;\n',
              '    let sites_domains = SiteDomainStore::connect(&config.database_url).await?;\n    let status_pages = StatusPageStore::connect(&config.database_url).await?;\n',
              1,
          )
          text = text.replace('        sites_domains,\n', '        sites_domains,\n        status_pages,\n', 1)
          text = text.replace(
              '        .merge(change_correlation::router())\n        .with_state(state);',
              '        .merge(change_correlation::router())\n        .merge(status_pages::router())\n        .with_state(state);',
              1,
          )
          main.write_text(text)

          page = Path('apps/web/app/projects/[projectId]/page.tsx')
          text = page.read_text()
          text = text.replace(
              "import IncidentsSection from './incidents-section'\n",
              "import IncidentsSection from './incidents-section'\nimport StatusPagesSection from './status-pages-section'\n",
              1,
          )
          text = text.replace(
              '      <IncidentsSection projectId={project.id} />',
              '      <IncidentsSection projectId={project.id} />\n\n      <StatusPagesSection projectId={project.id} />',
              1,
          )
          page.write_text(text)
          PY
          cargo fmt --all
          git rm .github/workflows/wire-status-pages-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/control-api/src/main.rs services/control-api/src/status_pages.rs apps/web/app/projects/[projectId]/page.tsx
          git commit -m "feat: wire status pages V1"
          git push
