name: Cleanup old Argus branches

on:
  push:
    branches:
      - agent/payload-app-data-v1

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete obsolete remote branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            agent/backups-recovery-v1
            agent/change-correlation-v1
            agent/compose-stack-actions-v1
            agent/compose-stacks-v1
            agent/dependency-graph-v1
            agent/deployments-releases-v1
            agent/desired-state-drift
            agent/desired-state-reconciliation-v1
            agent/docker-management-v1
            agent/domain-lifecycle-v1
            agent/domain-lifecycle-v2
            agent/environments-v1
            agent/firewall-enforcement-v1
            agent/github-integration-v1
            agent/incidents-v1
            agent/jobs-admin-v1
            agent/jobs-worker-v1
            agent/logs-diagnostics
            agent/monitor-incident-automation-v1
            agent/notifications-v1
            agent/projects-workspace
            agent/readiness-v1
            agent/restore-preflight-v1
            agent/security-firewall-v1
            agent/service-catalog-v1
            agent/site-monitoring-scheduling-v1
            agent/site-monitoring-v1
            agent/sites-domains-v1
            agent/status-pages-v1
            agent/transactional-restore-v1
            agent/payload-app-data-v1-backup
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done
