name: Temporary service catalog state fix
on:
  push:
    branches: [agent/service-catalog-v1]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/service-catalog-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Initialize service catalog state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('services/control-api/src/main.rs')
          text = path.read_text()
          needle = '    let github =\n        GitHubIntegrationStore::connect(&config.database_url, GitHubProvider::from_env()?).await?;\n'
          replacement = needle + '    let service_catalog = ServiceCatalogStore::connect(&config.database_url).await?;\n'
          if 'let service_catalog = ServiceCatalogStore::connect' not in text:
              text = text.replace(needle, replacement)
          if '        service_catalog,\n        web_api_token:' not in text:
              text = text.replace(
                  '        github,\n        web_api_token:',
                  '        github,\n        service_catalog,\n        web_api_token:',
              )
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Commit fix
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/control-api/src/main.rs
            git commit -m "fix: initialize service catalog state"
            git push
          fi
