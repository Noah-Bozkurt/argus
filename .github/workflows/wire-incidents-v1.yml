name: Wire incidents V1
on:
  push:
    branches: [agent/incidents-v1]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/incidents-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire module and project UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path('services/control-api/src/main.rs')
          text = main.read_text()
          text = text.replace('mod maintenance;\n', 'mod incidents;\nmod maintenance;\n', 1)
          text = text.replace('use maintenance::MaintenanceStore;\n', 'use incidents::IncidentStore;\nuse maintenance::MaintenanceStore;\n', 1)
          text = text.replace('    maintenance: MaintenanceStore,\n', '    maintenance: MaintenanceStore,\n    incidents: IncidentStore,\n', 1)
          text = text.replace(
              '    let maintenance = MaintenanceStore::connect(&config.database_url).await?;\n',
              '    let maintenance = MaintenanceStore::connect(&config.database_url).await?;\n    let incidents = IncidentStore::connect(&config.database_url).await?;\n',
              1,
          )
          text = text.replace('        maintenance,\n', '        maintenance,\n        incidents,\n', 1)
          text = text.replace(
              '        .merge(dependency_graph::router())\n        .with_state(state);',
              '        .merge(dependency_graph::router())\n        .merge(incidents::router())\n        .with_state(state);',
              1,
          )
          main.write_text(text)

          page = Path('apps/web/app/projects/[projectId]/page.tsx')
          text = page.read_text()
          text = text.replace(
              "import DependencyGraphSection from './dependency-graph-section'\n",
              "import DependencyGraphSection from './dependency-graph-section'\nimport IncidentsSection from './incidents-section'\n",
              1,
          )
          text = text.replace(
              '      <DependencyGraphSection projectId={project.id} />',
              '      <DependencyGraphSection projectId={project.id} />\n\n      <IncidentsSection projectId={project.id} />',
              1,
          )
          page.write_text(text)
          PY
          cargo fmt --all
          git rm .github/workflows/wire-incidents-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/control-api/src/main.rs services/control-api/src/incidents.rs apps/web/app/projects/[projectId]/page.tsx
          git commit -m "feat: wire incidents V1"
          git push
