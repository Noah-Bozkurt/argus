name: CI

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - services/**
      - migrations/**
      - apps/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - install.sh
      - scripts/**
      - deploy/**
      - docker-bake.hcl
      - .github/workflows/ci.yml
      - .github/workflows/publish-images.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - services/**
      - migrations/**
      - apps/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - install.sh
      - scripts/**
      - deploy/**
      - docker-bake.hcl
      - .github/workflows/ci.yml
      - .github/workflows/publish-images.yml
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    if: github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      content: ${{ steps.filter.outputs.content }}
      installer: ${{ steps.filter.outputs.installer }}
      deployment: ${{ steps.filter.outputs.deployment }}
      database: ${{ steps.filter.outputs.database }}
      cms_runtime: ${{ steps.filter.outputs.cms_runtime }}
      acceptance: ${{ steps.filter.outputs.acceptance }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Select validation scope
        id: scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
          else
            echo 'full=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'services/**'
              - 'migrations/**'
              - 'scripts/ci-rust-database-validation.sh'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            content:
              - 'apps/content/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'scripts/ci-content-runtime-validation.sh'
              - '.github/workflows/ci.yml'
            installer:
              - 'install.sh'
              - 'apps/installer/**'
              - 'crates/cli/**'
              - 'deploy/docker/host-tools.Dockerfile'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/publish-images.yml'
            deployment:
              - 'install.sh'
              - 'crates/cli/**'
              - 'scripts/first-server-smoke.sh'
              - 'scripts/update-first-test.sh'
              - 'scripts/recover-interrupted-update.sh'
              - 'scripts/uninstall.sh'
              - 'scripts/ci-deployment-validation.sh'
              - 'scripts/ci-prepare-docker.sh'
              - 'deploy/**'
              - 'docker-bake.hcl'
              - '.github/workflows/ci.yml'
              - '.github/workflows/publish-images.yml'
            database:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/common/**'
              - 'crates/protocol/**'
              - 'services/control-api/**'
              - 'services/worker/**'
              - 'migrations/**'
              - 'scripts/ci-rust-database-validation.sh'
              - 'scripts/ci-prepare-docker.sh'
              - '.github/workflows/ci.yml'
            cms_runtime:
              - 'apps/content/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'scripts/first-server-content-acceptance.mjs'
              - 'scripts/test-native-cms-runtime.sh'
              - 'scripts/test-media-runtime.sh'
              - 'scripts/test-forms-runtime.sh'
              - 'scripts/ci-content-runtime-validation.sh'
              - 'scripts/ci-prepare-docker.sh'
              - 'services/control-api/src/job_execution.rs'
              - 'services/control-api/migrations/**'
              - '.github/workflows/ci.yml'
            acceptance:
              - 'install.sh'
              - 'crates/cli/**'
              - 'scripts/first-server-**'
              - 'scripts/reset-first-test.sh'
              - 'scripts/test-first-server-**'
              - 'scripts/test-reset-first-test.sh'
              - 'scripts/ci-acceptance-validation.sh'
              - '.github/workflows/ci.yml'

  rust-database:
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.database == 'true' ||
      needs.changes.outputs.full == 'true'
    runs-on: [self-hosted, linux, x64, argus, rust]
    timeout-minutes: 40
    env:
      CARGO_HOME: /home/runner/.cache/argus/cargo-home
      CARGO_TARGET_DIR: /home/runner/.cache/argus/cargo-target
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Docker access
        if: needs.changes.outputs.database == 'true' || needs.changes.outputs.full == 'true'
        run: bash scripts/ci-prepare-docker.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Validate Rust and database runtime
        env:
          ARGUS_CI_RUN_RUST: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.full == 'true' }}
          ARGUS_CI_RUN_DATABASE: ${{ needs.changes.outputs.database == 'true' || needs.changes.outputs.full == 'true' }}
        run: bash scripts/ci-rust-database-validation.sh

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.full == 'true'
    runs-on: [self-hosted, linux, x64, argus, general]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use local pnpm store
        run: pnpm config set store-dir "${ARGUS_PNPM_STORE_DIR:-$HOME/.cache/argus/pnpm}"
      - run: pnpm install --frozen-lockfile
      - name: Typecheck Web
        run: pnpm --filter @argus/web exec tsc --noEmit

  content-cms:
    needs: changes
    if: >-
      needs.changes.outputs.content == 'true' ||
      needs.changes.outputs.cms_runtime == 'true' ||
      needs.changes.outputs.full == 'true'
    runs-on: [self-hosted, linux, x64, argus, general]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use local pnpm store
        run: pnpm config set store-dir "${ARGUS_PNPM_STORE_DIR:-$HOME/.cache/argus/pnpm}"
      - run: pnpm install --frozen-lockfile
      - name: Prepare Docker access
        if: needs.changes.outputs.cms_runtime == 'true' || needs.changes.outputs.full == 'true'
        run: bash scripts/ci-prepare-docker.sh
      - name: Validate content and CMS runtime
        env:
          ARGUS_CI_RUN_CONTENT: ${{ needs.changes.outputs.content == 'true' || needs.changes.outputs.full == 'true' }}
          ARGUS_CI_RUN_CMS: ${{ needs.changes.outputs.cms_runtime == 'true' || needs.changes.outputs.full == 'true' }}
        run: bash scripts/ci-content-runtime-validation.sh

  installer:
    needs: changes
    if: needs.changes.outputs.installer == 'true' || needs.changes.outputs.full == 'true'
    runs-on: [self-hosted, linux, x64, argus, general]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use local pnpm store
        run: pnpm config set store-dir "${ARGUS_PNPM_STORE_DIR:-$HOME/.cache/argus/pnpm}"
      - run: pnpm install --frozen-lockfile
      - name: Test installer packaging
        run: pnpm --filter @argus/installer test

  acceptance:
    needs: changes
    if: needs.changes.outputs.acceptance == 'true' || needs.changes.outputs.full == 'true'
    runs-on: [self-hosted, linux, x64, argus, general]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate acceptance tooling
        run: bash scripts/ci-acceptance-validation.sh

  deployment:
    needs: changes
    if: needs.changes.outputs.deployment == 'true' || needs.changes.outputs.full == 'true'
    runs-on: [self-hosted, linux, x64, argus, general]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Docker access
        run: bash scripts/ci-prepare-docker.sh
      - name: Validate deployment lifecycle
        run: bash scripts/ci-deployment-validation.sh

  validation-gate:
    needs:
      - changes
      - rust-database
      - web
      - content-cms
      - installer
      - acceptance
      - deployment
    if: always() && needs.changes.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      RUST_DATABASE_RESULT: ${{ needs.rust-database.result }}
      WEB_RESULT: ${{ needs.web.result }}
      CONTENT_CMS_RESULT: ${{ needs.content-cms.result }}
      INSTALLER_RESULT: ${{ needs.installer.result }}
      ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
      DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
    steps:
      - name: Require all selected validation jobs to pass
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "$CHANGES_RESULT" \
            "$RUST_DATABASE_RESULT" \
            "$WEB_RESULT" \
            "$CONTENT_CMS_RESULT" \
            "$INSTALLER_RESULT" \
            "$ACCEPTANCE_RESULT" \
            "$DEPLOYMENT_RESULT"
          do
            case "$result" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done
          [[ "$failed" -eq 0 ]]

  release-gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, argus, rust]
    timeout-minutes: 20
    env:
      CARGO_HOME: /home/runner/.cache/argus/cargo-home
      CARGO_TARGET_DIR: /home/runner/.cache/argus/cargo-target
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Docker access
        run: bash scripts/ci-prepare-docker.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release metadata and lifecycle syntax
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          bash -n install.sh
          bash -n scripts/first-server-smoke.sh
          bash -n scripts/update-first-test.sh
          bash -n scripts/recover-interrupted-update.sh
          bash -n scripts/uninstall.sh
          docker buildx bake --print >/dev/null
      - name: Validate release Compose configuration
        run: |
          set -euo pipefail
          cp deploy/compose/Caddyfile.template deploy/compose/Caddyfile
          envfile="$RUNNER_TEMP/argus-release-gate.env"
          cat >"$envfile" <<'ENV'
          ARGUS_REGISTRY=ghcr.io/noah-bozkurt
          ARGUS_VERSION=test
          ARGUS_DOMAIN=argus.example.test
          ARGUS_CONTENT_DOMAIN=content.argus.example.test
          ARGUS_POSTGRES_PASSWORD=x
          ARGUS_WEB_API_TOKEN=x
          ARGUS_WORKER_TOKEN=x
          ARGUS_CONTENT_SYNC_TOKEN=x
          PAYLOAD_SECRET=x
          ARGUS_ORG_ID=00000000-0000-4000-8000-000000000001
          ARGUS_USER_ID=00000000-0000-4000-8000-000000000002
          ARGUS_SERVER_ID=00000000-0000-4000-8000-000000000003
          ARGUS_GITHUB_TOKEN=
          ARGUS_RUST_LOG=info
          ENV
          docker compose --project-directory deploy/compose --env-file "$envfile" -f deploy/compose/compose.yaml config >/dev/null
