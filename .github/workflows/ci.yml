name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo fmt --all -- --check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @argus/web exec tsc --noEmit
      - run: pnpm --filter @argus/content run typecheck

  server-test-readiness:
    needs:
      - rust
      - web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus-test-password
          POSTGRES_DB: argus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argus -d argus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate installer scripts
        run: |
          bash -n install.sh
          bash -n scripts/reset-first-test.sh

      - name: Validate Compose configuration
        run: |
          cp deploy/compose/Caddyfile.template deploy/compose/Caddyfile
          cat > /tmp/argus-test.env <<'EOF'
          ARGUS_REGISTRY=ghcr.io/noah-bozkurt
          ARGUS_VERSION=test
          ARGUS_DOMAIN=argus.example.test
          ARGUS_CONTENT_DOMAIN=content.argus.example.test
          ARGUS_POSTGRES_PASSWORD=test-postgres-password
          ARGUS_WEB_API_TOKEN=0123456789abcdef0123456789abcdef
          ARGUS_WORKER_TOKEN=abcdef0123456789abcdef0123456789
          ARGUS_CONTENT_SYNC_TOKEN=11111111111111111111111111111111
          PAYLOAD_SECRET=22222222222222222222222222222222
          ARGUS_ORG_ID=00000000-0000-4000-8000-000000000001
          ARGUS_USER_ID=00000000-0000-4000-8000-000000000002
          ARGUS_GITHUB_TOKEN=
          ARGUS_RUST_LOG=info
          EOF
          docker compose \
            --project-directory deploy/compose \
            --env-file /tmp/argus-test.env \
            -f deploy/compose/compose.yaml \
            config >/dev/null

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Boot Control API from an empty PostgreSQL database
        env:
          DATABASE_URL: postgresql://argus:argus-test-password@127.0.0.1:5432/argus
          ARGUS_CONTROL_API_BIND: 127.0.0.1:8080
          ARGUS_WEB_API_TOKEN: 0123456789abcdef0123456789abcdef
          ARGUS_WORKER_TOKEN: abcdef0123456789abcdef0123456789
          RUST_LOG: info
        run: |
          set -euo pipefail
          cargo run --locked -p control-api >/tmp/argus-control-api.log 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 300); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$pid" >/dev/null 2>&1; then
              cat /tmp/argus-control-api.log
              exit 1
            fi
            sleep 1
          done
          echo "Control API did not become healthy within 5 minutes" >&2
          cat /tmp/argus-control-api.log
          exit 1

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile

      - name: Build Web standalone artifact
        run: pnpm --filter @argus/web run build

      - name: Build Payload standalone artifact
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://argus:argus-test-password@127.0.0.1:5432/argus
          ARGUS_CONTENT_DB_SCHEMA: argus_content
          PAYLOAD_SECRET: 22222222222222222222222222222222
          PAYLOAD_PUBLIC_URL: https://content.argus.example.test
          ARGUS_CONTENT_SYNC_TOKEN: 11111111111111111111111111111111
          PAYLOAD_DB_PUSH: "false"
        run: pnpm --filter @argus/content run build
