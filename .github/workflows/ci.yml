name: CI

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - services/**
      - migrations/**
      - apps/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - install.sh
      - scripts/**
      - deploy/**
      - .github/workflows/ci.yml
      - .github/workflows/deploy-installer-pages.yml
      - .github/workflows/publish-images.yml
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - services/**
      - migrations/**
      - apps/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - install.sh
      - scripts/**
      - deploy/**
      - .github/workflows/ci.yml
      - .github/workflows/deploy-installer-pages.yml
      - .github/workflows/publish-images.yml
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: [self-hosted, linux, x64]
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      content: ${{ steps.filter.outputs.content }}
      installer: ${{ steps.filter.outputs.installer }}
      deployment: ${{ steps.filter.outputs.deployment }}
      database: ${{ steps.filter.outputs.database }}
      cms_runtime: ${{ steps.filter.outputs.cms_runtime }}
      acceptance: ${{ steps.filter.outputs.acceptance }}
      full: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'services/**'
              - 'migrations/**'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            content:
              - 'apps/content/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            installer:
              - 'install.sh'
              - 'apps/installer/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy-installer-pages.yml'
            deployment:
              - 'install.sh'
              - 'scripts/first-server-smoke.sh'
              - 'scripts/update-first-test.sh'
              - 'scripts/recover-interrupted-update.sh'
              - 'deploy/**'
              - '.github/workflows/ci.yml'
            database:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'services/control-api/**'
              - 'services/worker/**'
              - '.github/workflows/ci.yml'
            cms_runtime:
              - 'apps/content/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'scripts/first-server-content-acceptance.mjs'
              - 'scripts/test-native-cms-runtime.sh'
              - 'scripts/test-media-runtime.sh'
              - 'scripts/test-forms-runtime.sh'
              - 'services/control-api/src/job_execution.rs'
              - 'services/control-api/migrations/**'
              - '.github/workflows/ci.yml'
            acceptance:
              - 'install.sh'
              - 'scripts/first-server-**'
              - 'scripts/reset-first-test.sh'
              - 'scripts/test-first-server-**'
              - 'scripts/test-reset-first-test.sh'
              - '.github/workflows/ci.yml'

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.full == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked

  javascript:
    needs: changes
    if: >-
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.content == 'true' ||
      needs.changes.outputs.installer == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.web == 'true'
        run: pnpm --filter @argus/web exec tsc --noEmit
      - if: needs.changes.outputs.content == 'true'
        run: pnpm --filter @argus/content run typecheck
      - if: needs.changes.outputs.content == 'true'
        run: pnpm --filter @argus/content run test:cms-contract
      - if: needs.changes.outputs.installer == 'true'
        run: pnpm --filter @argus/installer test
      - if: needs.changes.outputs.installer == 'true'
        run: pnpm --filter @argus/installer build
      - name: Upload tested installer site
        if: needs.changes.outputs.installer == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: installer-site
          path: apps/installer/dist
          if-no-files-found: error
          retention-days: 1

  acceptance-tooling:
    needs: changes
    if: needs.changes.outputs.acceptance == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Validate acceptance scripts
        run: |
          set -euo pipefail
          bash -n scripts/first-server-acceptance.sh
          bash -n scripts/first-server-product-acceptance.sh
          bash -n scripts/first-server-restore-acceptance.sh
          bash -n scripts/first-server-reset-reinstall-acceptance.sh
          bash -n scripts/reset-first-test.sh
          bash -n scripts/test-first-server-acceptance.sh
          bash -n scripts/test-first-server-restore-acceptance.sh
          bash -n scripts/test-first-server-reset-reinstall-acceptance.sh
          bash -n scripts/test-reset-first-test.sh
          node --check scripts/first-server-content-acceptance.mjs
      - name: Test acceptance helpers
        run: |
          bash scripts/test-first-server-acceptance.sh
          bash scripts/test-first-server-restore-acceptance.sh
          bash scripts/test-first-server-reset-reinstall-acceptance.sh
          bash scripts/test-reset-first-test.sh
          node --test scripts/first-server-content-acceptance.test.mjs

  deployment-safety:
    needs:
      - changes
      - acceptance-tooling
    if: >-
      always() &&
      (needs.changes.outputs.deployment == 'true' || needs.changes.outputs.full == 'true') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment lifecycle scripts
        run: |
          set -euo pipefail
          bash -n scripts/first-server-smoke.sh
          bash -n scripts/test-native-cms-runtime.sh
          bash -n scripts/test-media-runtime.sh
          bash -n scripts/test-forms-runtime.sh
          bash -n scripts/update-first-test.sh
          bash -n scripts/recover-interrupted-update.sh
          grep -Fq 'org.opencontainers.image.revision' install.sh
          grep -Fq 'pg_dump' scripts/update-first-test.sh
          grep -Fq 'pg_restore' scripts/update-first-test.sh
          grep -Fq 'ROLLBACK_READY=1' scripts/update-first-test.sh
          grep -Fq 'TRANSACTION_FORMAT_VERSION=2' scripts/update-first-test.sh
          grep -Fq 'file-snapshot.sha256' scripts/update-first-test.sh
          grep -Fq 'database-snapshot.sha256' scripts/update-first-test.sh
          grep -Fq 'target-start-armed' scripts/update-first-test.sh
          grep -Fq 'pg_database_size(current_database())' scripts/update-first-test.sh
          grep -Fq 'df -PB1' scripts/update-first-test.sh
          grep -Fq 'ExecStartPre=/usr/local/bin/argusctl recover-update' deploy/systemd/argus-helper.service
          grep -Fq 'ABORTED_PRE_MUTATION' scripts/recover-interrupted-update.sh
          grep -Fq 'ARGUS_UPDATE_RECOVERY_RETRY_FAILED' scripts/recover-interrupted-update.sh
          grep -Fq 'recover-update --retry-failed' scripts/recover-interrupted-update.sh
          grep -Fq 'pg_restore --list' scripts/recover-interrupted-update.sh
          grep -Fq 'up -d --no-deps --force-recreate caddy' scripts/update-first-test.sh
          grep -Fq 'up -d --no-deps --force-recreate caddy' scripts/recover-interrupted-update.sh
          grep -Fq 'Caddyfile.rendered' scripts/update-first-test.sh
          grep -Fq "grep -Eq '__[A-Z0-9_]+__'" scripts/update-first-test.sh
          update_lock="$(sed -n 's/^LOCK_FILE="\(.*\)"$/\1/p' scripts/update-first-test.sh | head -n1)"
          recovery_lock="$(sed -n 's/^LOCK_FILE="\(.*\)"$/\1/p' scripts/recover-interrupted-update.sh | head -n1)"
          [[ -n "$update_lock" ]]
          [[ "$update_lock" == "$recovery_lock" ]]

      - name: Test update storage helper safety
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          export ARGUS_STATE_DIR="$tmp/state"
          # shellcheck disable=SC1091
          source scripts/update-first-test.sh --internal-test-library

          [[ "$(required_snapshot_space_bytes 0)" == "1073741824" ]]
          [[ "$(required_snapshot_space_bytes 1073741824)" == "3221225472" ]]

          mkdir -p "$BACKUP_ROOT"
          make_transaction() {
            local name="$1" result="${2:-}"
            mkdir -p "$BACKUP_ROOT/$name/files"
            printf 'FROM_REVISION=x\n' >"$BACKUP_ROOT/$name/metadata.env"
            if [[ -n "$result" ]]; then
              printf '%s\n' "$result" >"$BACKUP_ROOT/$name/result"
            fi
          }

          make_transaction 20260819T120005Z-aaaaaaaaaaaa-to-bbbbbbbbbbbb SUCCEEDED
          make_transaction 20260819T120004Z-aaaaaaaaaaaa-to-bbbbbbbbbbbb ROLLED_BACK
          make_transaction 20260819T120003Z-aaaaaaaaaaaa-to-bbbbbbbbbbbb SUCCEEDED
          make_transaction 20260819T120002Z-aaaaaaaaaaaa-to-bbbbbbbbbbbb ROLLED_BACK
          make_transaction 20260819T120001Z-aaaaaaaaaaaa-to-bbbbbbbbbbbb SUCCEEDED
          make_transaction 20260819T115959Z-aaaaaaaaaaaa-to-bbbbbbbbbbbb ROLLBACK_FAILED
          make_transaction 20260819T115958Z-aaaaaaaaaaaa-to-bbbbbbbbbbbb
          make_transaction manual-snapshot SUCCEEDED

          prune_completed_transactions

          [[ -d "$BACKUP_ROOT/20260819T120005Z-aaaaaaaaaaaa-to-bbbbbbbbbbbb" ]]
          [[ -d "$BACKUP_ROOT/20260819T120004Z-aaaaaaaaaaaa-to-bbbbbbbbbbbb" ]]
          [[ -d "$BACKUP_ROOT/20260819T120003Z-aaaaaaaaaaaa-to-bbbbbbbbbbbb" ]]
          [[ ! -e "$BACKUP_ROOT/20260819T120002Z-aaaaaaaaaaaa-to-bbbbbbbbbbbb" ]]
          [[ ! -e "$BACKUP_ROOT/20260819T120001Z-aaaaaaaaaaaa-to-bbbbbbbbbbbb" ]]
          [[ -d "$BACKUP_ROOT/20260819T115959Z-aaaaaaaaaaaa-to-bbbbbbbbbbbb" ]]
          [[ -d "$BACKUP_ROOT/20260819T115958Z-aaaaaaaaaaaa-to-bbbbbbbbbbbb" ]]
          [[ -d "$BACKUP_ROOT/manual-snapshot" ]]

      - name: Test update transaction phase safety
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          export ARGUS_STATE_DIR="$tmp/update-state"
          # shellcheck disable=SC1091
          source scripts/update-first-test.sh --internal-test-library

          ARGUS_UPDATE_ACCEPTANCE_FAILURE=after-target-start-armed
          ARGUS_UPDATE_ACCEPTANCE_CONFIRM_FAILURE=wrong
          if (validate_acceptance_failure_hook); then
            echo 'incomplete acceptance failure confirmation unexpectedly accepted' >&2
            exit 1
          fi
          ARGUS_UPDATE_ACCEPTANCE_CONFIRM_FAILURE=ROLLBACK-TEST-ONLY
          validate_acceptance_failure_hook
          unset ARGUS_UPDATE_ACCEPTANCE_FAILURE ARGUS_UPDATE_ACCEPTANCE_CONFIRM_FAILURE

          TRANSACTION_DIR="$BACKUP_ROOT/20260819T130000Z-aaaaaaaaaaaa-to-bbbbbbbbbbbb"
          TARGET_REVISION=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          mkdir -p "$TRANSACTION_DIR"
          while IFS= read -r path; do
            mkdir -p "$(dirname "$TRANSACTION_DIR/$path")"
            printf 'snapshot:%s\n' "$path" >"$TRANSACTION_DIR/$path"
          done < <(file_snapshot_paths)

          seal_file_snapshot
          verify_file_snapshot "$TRANSACTION_DIR"
          printf 'corruption\n' >>"$TRANSACTION_DIR/files/bin/argusctl"
          if verify_file_snapshot "$TRANSACTION_DIR"; then
            echo 'corrupted file snapshot unexpectedly verified' >&2
            exit 1
          fi
          printf 'snapshot:files/bin/argusctl\n' >"$TRANSACTION_DIR/files/bin/argusctl"
          seal_file_snapshot

          printf 'fake-dump\n' >"$TRANSACTION_DIR/argus.dump"
          (
            cd "$TRANSACTION_DIR"
            sha256sum argus.dump >database-snapshot.sha256
          )
          verify_database_snapshot_file "$TRANSACTION_DIR"
          DATABASE_BACKUP_READY=1
          arm_target_start
          [[ "$(cat "$TRANSACTION_DIR/target-start-armed")" == "$TARGET_REVISION" ]]

          export ARGUS_STATE_DIR="$tmp/recovery-state"
          export ARGUS_INSTALL_DIR="$tmp/recovery-install"
          mkdir -p "$ARGUS_STATE_DIR/update-backups" "$ARGUS_INSTALL_DIR"
          FROM=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          TO=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          early="$ARGUS_STATE_DIR/update-backups/20260819T130100Z-aaaaaaaaaaaa-to-bbbbbbbbbbbb"
          mkdir -p "$early"
          cat >"$early/metadata.env" <<EOF
          TRANSACTION_FORMAT=2
          FROM_REVISION=$FROM
          TO_REVISION=$TO
          EOF
          printf 'ARGUS_VERSION=%s\n' "$FROM" >"$ARGUS_INSTALL_DIR/.env"

          # shellcheck disable=SC1091
          source scripts/recover-interrupted-update.sh --internal-test-library
          load_transaction_metadata "$early"
          if prepare_transaction_recovery "$early"; then
            echo 'pre-mutation transaction unexpectedly required rollback' >&2
            exit 1
          fi
          [[ "$(cat "$early/result")" == 'ABORTED_PRE_MUTATION' ]]

          marker_test="$ARGUS_STATE_DIR/update-backups/marker-test"
          mkdir -p "$marker_test"
          TRANSACTION_FORMAT=2
          TO_REVISION="$TO"
          printf '%s\n' "$FROM" >"$marker_test/target-start-armed"
          if (target_start_was_armed "$marker_test"); then
            echo 'wrong target-start revision unexpectedly accepted' >&2
            exit 1
          fi

          failed="$ARGUS_STATE_DIR/update-backups/20260819T130200Z-aaaaaaaaaaaa-to-bbbbbbbbbbbb"
          mkdir -p "$failed"
          cat >"$failed/metadata.env" <<EOF
          TRANSACTION_FORMAT=2
          FROM_REVISION=$FROM
          TO_REVISION=$TO
          EOF
          printf 'ROLLBACK_FAILED\n' >"$failed/result"

          RETRY_FAILED=0
          failed_recovery_out="$RUNNER_TEMP/argus-failed-recovery.out"
          failed_recovery_err="$RUNNER_TEMP/argus-failed-recovery.err"
          if find_recovery_transaction >"$failed_recovery_out" 2>"$failed_recovery_err"; then
            blocked_status=0
          else
            blocked_status=$?
          fi
          [[ "$blocked_status" -eq 2 ]]
          grep -Fq 'unresolved failed update rollback blocks automatic startup' "$failed_recovery_err"

          RETRY_FAILED=1
          retry_candidate="$(find_recovery_transaction)"
          [[ "$retry_candidate" == "$failed" ]]

      - name: Validate Compose configuration
        run: |
          cp deploy/compose/Caddyfile.template deploy/compose/Caddyfile
          compose_env="$RUNNER_TEMP/argus-test.env"
          cat > "$compose_env" <<'EOF'
          ARGUS_REGISTRY=ghcr.io/noah-bozkurt
          ARGUS_VERSION=test
          ARGUS_DOMAIN=argus.example.test
          ARGUS_CONTENT_DOMAIN=content.argus.example.test
          ARGUS_POSTGRES_PASSWORD=test-postgres-password
          ARGUS_WEB_API_TOKEN=0123456789abcdef0123456789abcdef
          ARGUS_WORKER_TOKEN=abcdef0123456789abcdef0123456789
          ARGUS_CONTENT_SYNC_TOKEN=11111111111111111111111111111111
          PAYLOAD_SECRET=22222222222222222222222222222222
          ARGUS_ORG_ID=00000000-0000-4000-8000-000000000001
          ARGUS_USER_ID=00000000-0000-4000-8000-000000000002
          ARGUS_GITHUB_TOKEN=
          ARGUS_RUST_LOG=info
          EOF
          docker compose \
            --project-directory deploy/compose \
            --env-file "$compose_env" \
            -f deploy/compose/compose.yaml \
            config >/dev/null

      - name: Validate Caddy routing configuration
        run: |
          set -euo pipefail
          caddyfile="$RUNNER_TEMP/argus-Caddyfile"
          hash="$(docker run --rm caddy:2-alpine caddy hash-password --plaintext test-password)"
          cp deploy/compose/Caddyfile.template "$caddyfile"
          sed -i \
            -e 's|__ARGUS_DOMAIN__|argus.example.test|g' \
            -e 's|__ARGUS_CONTENT_DOMAIN__|content.argus.example.test|g' \
            -e 's|__BASIC_AUTH_USER__|argus|g' \
            -e "s|__BASIC_AUTH_HASH__|${hash}|g" \
            "$caddyfile"
          grep -Fq 'path /public/status/*' "$caddyfile"
          grep -Fq 'path /public/* /api/media/file/*' "$caddyfile"
          docker run --rm \
            -v "$caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  runtime-integration:
    needs:
      - changes
      - rust
      - javascript
    if: >-
      always() &&
      (needs.changes.outputs.database == 'true' ||
       needs.changes.outputs.cms_runtime == 'true' ||
       needs.changes.outputs.full == 'true') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus-test-password
          POSTGRES_DB: argus
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U argus -d argus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify migrations and Worker scheduling
        env:
          DATABASE_URL: postgresql://argus:argus-test-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/argus
          ARGUS_CONTROL_API_BIND: 127.0.0.1:18080
          ARGUS_CONTROL_API_URL: http://127.0.0.1:18080
          ARGUS_WEB_API_TOKEN: 0123456789abcdef0123456789abcdef
          ARGUS_WORKER_TOKEN: abcdef0123456789abcdef0123456789
          ARGUS_CONTENT_URL: http://127.0.0.1:9
          ARGUS_CONTENT_SYNC_TOKEN: '11111111111111111111111111111111'
          ARGUS_WORKER_POLL_SECONDS: 1
          RUST_LOG: info
        run: |
          set -euo pipefail
          control_log="$RUNNER_TEMP/argus-control-api.log"
          worker_log="$RUNNER_TEMP/argus-worker.log"
          cargo run --locked -p control-api >"$control_log" 2>&1 &
          control_pid=$!
          worker_pid=''
          trap 'kill "$control_pid" ${worker_pid:-} >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 300); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$control_pid" >/dev/null 2>&1; then
              cat "$control_log"
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/health >/dev/null || {
            echo "Control API did not become healthy within 5 minutes" >&2
            cat "$control_log"
            exit 1
          }

          psql() {
            docker run --rm --network host \
              -e PGPASSWORD=argus-test-password postgres:16 \
              psql -v ON_ERROR_STOP=1 -h 127.0.0.1 \
              -p '${{ job.services.postgres.ports[5432] }}' -U argus -d argus "$@"
          }

          [[ "$(psql -Atc "SELECT indexprs IS NULL AND indpred IS NULL FROM pg_index WHERE indexrelid='background_jobs_dedupe_idx'::regclass")" == "t" ]]
          psql -c "INSERT INTO organizations(id,name) VALUES('00000000-0000-4000-8000-000000000001','CI')"

          cargo run --locked -p argus-worker >"$worker_log" 2>&1 &
          worker_pid=$!
          for _ in $(seq 1 60); do
            if [[ "$(psql -Atc "SELECT EXISTS(SELECT 1 FROM background_jobs WHERE dedupe_key IS NOT NULL)")" == "t" ]]; then
              exit 0
            fi
            if ! kill -0 "$worker_pid" >/dev/null 2>&1; then
              cat "$worker_log"
              exit 1
            fi
            sleep 1
          done
          echo "Worker did not materialize a scheduled job within 60 seconds" >&2
          cat "$worker_log"
          exit 1

      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.cms_runtime == 'true' || needs.changes.outputs.full == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.cms_runtime == 'true' || needs.changes.outputs.full == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - if: needs.changes.outputs.cms_runtime == 'true' || needs.changes.outputs.full == 'true'
        run: pnpm install --frozen-lockfile

      - name: Exercise native CMS draft and publication workflow
        if: needs.changes.outputs.cms_runtime == 'true' || needs.changes.outputs.full == 'true'
        env:
          DATABASE_URL: postgresql://argus:argus-test-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/argus
          ARGUS_CONTENT_DB_SCHEMA: argus_content
          PAYLOAD_SECRET: payload-runtime-secret-0000000000
          PAYLOAD_PUBLIC_URL: http://127.0.0.1:3000
          ARGUS_CONTENT_SYNC_TOKEN: content-sync-runtime-000000000000
          ARGUS_MEDIA_DIR: ${{ runner.temp }}/argus-content-media
          PAYLOAD_DB_PUSH: "false"
        run: |
          set -euo pipefail
          pnpm --filter @argus/content exec payload migrate
          content_log="$RUNNER_TEMP/argus-content.log"
          pnpm --filter @argus/content dev >"$content_log" 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null 2>&1; then
              bash scripts/test-native-cms-runtime.sh
              bash scripts/test-media-runtime.sh
              bash scripts/test-forms-runtime.sh
              ARGUS_TEST_PROJECT_ID=00000000-0000-4000-8000-000000000003 \
              ARGUS_TEST_ORG_ID=00000000-0000-4000-8000-000000000001 \
              ARGUS_TEST_USER_ID=00000000-0000-4000-8000-000000000002 \
                node scripts/first-server-content-acceptance.mjs >/dev/null
              exit 0
            fi
            if ! kill -0 "$pid" >/dev/null 2>&1; then
              cat "$content_log"
              exit 1
            fi
            sleep 1
          done
          echo "Payload did not become healthy within 3 minutes" >&2
          cat "$content_log"
          exit 1
