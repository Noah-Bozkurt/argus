name: Delete merged PR branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'chore/delete-pr79-branch'
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Delete merged branch and cleanup branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          delete_ref() {
            curl --fail-with-body -L \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/$1"
          }
          delete_ref 'fix/project-system-runtime'
          delete_ref 'chore/delete-pr79-branch'
