name: Format PR 79 branch

on:
  push:
    branches:
      - fix/project-system-runtime

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-system-runtime
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources and restore helper workflow
        run: |
          set -euo pipefail
          cargo fmt --all
          git fetch origin main
          git checkout origin/main -- .github/workflows/format-native-lifecycle.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- crates/cli/src .github/workflows/format-native-lifecycle.yml
          git commit -m 'style(rust): apply cargo fmt'
          git push origin HEAD:fix/project-system-runtime
