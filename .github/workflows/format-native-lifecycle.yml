name: Format native lifecycle branch

on:
  push:
    branches:
      - refactor/native-lifecycle

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: [self-hosted, linux, x64, argus]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/native-lifecycle
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit formatting when needed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- crates/cli/src
          git commit -m 'style(rust): format native lifecycle code'
          git push origin HEAD:refactor/native-lifecycle
