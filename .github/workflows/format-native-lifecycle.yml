name: Delete merged PR branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'chore/delete-pr79-branch'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/delete-pr79-branch
          fetch-depth: 0
      - name: Delete merged branch and cleanup branch
        run: |
          set -euo pipefail
          git push origin --delete fix/project-system-runtime
          git push origin --delete chore/delete-pr79-branch
