name: Temporary environments wiring
on:
  push:
    branches: [agent/environments-v1]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/environments-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire environment module and web API
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('services/control-api/src/main.rs')
          text = main.read_text()
          text = text.replace('mod desired_state;\n', 'mod desired_state;\nmod environments;\n')
          text = text.replace(
              'use desired_state::{DesiredState, DesiredStateError, DesiredStateStore};\n',
              'use desired_state::{DesiredState, DesiredStateError, DesiredStateStore};\nuse environments::EnvironmentStore;\n',
          )
          text = text.replace(
              '    desired_state: DesiredStateStore,\n',
              '    desired_state: DesiredStateStore,\n    environments: EnvironmentStore,\n',
          )
          text = text.replace(
              '    let desired_state = DesiredStateStore::connect(&config.database_url).await?;\n',
              '    let desired_state = DesiredStateStore::connect(&config.database_url).await?;\n    let environments = EnvironmentStore::connect(&config.database_url).await?;\n',
          )
          text = text.replace(
              '        desired_state,\n        workspace,\n',
              '        desired_state,\n        environments,\n        workspace,\n',
          )
          text = text.replace(
              '        .merge(service_catalog::router())\n        .with_state(state);',
              '        .merge(service_catalog::router())\n        .merge(environments::router())\n        .with_state(state);',
          )
          main.write_text(text)

          api = Path('apps/web/lib/api.ts')
          text = api.read_text()
          if 'export type ProjectEnvironment = {' not in text:
              text += '''\n\nexport type ProjectEnvironment = {\n  id: string\n  project_id: string\n  name: string\n  environment_type: 'development' | 'preview' | 'staging' | 'production' | 'custom' | string\n  description: string\n  is_protected: boolean\n  sort_order: number\n  server_count: number\n  service_count: number\n  created_at: string\n  updated_at: string\n}\n\nexport type EnvironmentInput = {\n  name: string\n  environment_type: string\n  description?: string\n  is_protected?: boolean\n}\n\nexport const getProjectEnvironments = (projectId: string): Promise<ProjectEnvironment[]> =>\n  request(`/projects/${projectId}/environments`)\n\nexport async function createProjectEnvironment(\n  projectId: string,\n  input: EnvironmentInput,\n): Promise<ProjectEnvironment> {\n  return request(`/projects/${projectId}/environments`, {\n    method: 'POST',\n    headers: { 'content-type': 'application/json' },\n    body: JSON.stringify(input),\n  })\n}\n\nexport async function updateProjectEnvironment(\n  projectId: string,\n  environmentId: string,\n  input: EnvironmentInput,\n): Promise<ProjectEnvironment> {\n  return request(`/projects/${projectId}/environments/${environmentId}`, {\n    method: 'PUT',\n    headers: { 'content-type': 'application/json' },\n    body: JSON.stringify(input),\n  })\n}\n\nexport async function deleteProjectEnvironment(projectId: string, environmentId: string): Promise<void> {\n  await request(`/projects/${projectId}/environments/${environmentId}`, { method: 'DELETE' })\n}\n'''
          api.write_text(text)

          page = Path('apps/web/app/projects/[projectId]/page.tsx')
          text = page.read_text()
          if "import EnvironmentsSection from './environments-section'" not in text:
              text = text.replace(
                  "import ServiceCatalogSection from './service-catalog-section'\n",
                  "import ServiceCatalogSection from './service-catalog-section'\nimport EnvironmentsSection from './environments-section'\n",
              )
          if '<EnvironmentsSection projectId={project.id} />' not in text:
              text = text.replace(
                  '      <ServiceCatalogSection projectId={project.id} />',
                  '      <EnvironmentsSection projectId={project.id} />\n\n      <ServiceCatalogSection projectId={project.id} />',
                  1,
              )
          page.write_text(text)
          PY
          cargo fmt --all
      - name: Commit wiring
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/control-api/src/main.rs services/control-api/src/environments.rs apps/web/lib/api.ts apps/web/app/projects/[projectId]/page.tsx
            git commit -m "feat: wire environments V1"
            git push
          fi
