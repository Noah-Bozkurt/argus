name: Temporary service catalog wiring
on:
  push:
    branches: [agent/service-catalog-v1]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/service-catalog-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire backend and web
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('services/control-api/src/main.rs')
          text = main.read_text()
          text = text.replace(
              'mod project_workspace;\n',
              'mod project_workspace;\nmod service_catalog;\n',
          )
          text = text.replace(
              'use project_workspace::ProjectWorkspaceStore;\n',
              'use project_workspace::ProjectWorkspaceStore;\nuse service_catalog::ServiceCatalogStore;\n',
          )
          text = text.replace(
              '    github: GitHubIntegrationStore,\n    web_api_token: Arc<String>,',
              '    github: GitHubIntegrationStore,\n    service_catalog: ServiceCatalogStore,\n    web_api_token: Arc<String>,',
          )
          text = text.replace(
              '    .await?;\n    let state = AppState {\n        storage,\n        maintenance,\n        desired_state,\n        workspace,\n        github,\n',
              '    .await?;\n    let service_catalog = ServiceCatalogStore::connect(&config.database_url).await?;\n    let state = AppState {\n        storage,\n        maintenance,\n        desired_state,\n        workspace,\n        github,\n        service_catalog,\n',
              1,
          )
          text = text.replace(
              '        .merge(github_integration::router())\n        .with_state(state);',
              '        .merge(github_integration::router())\n        .merge(service_catalog::router())\n        .with_state(state);',
          )
          main.write_text(text)

          api = Path('apps/web/lib/api.ts')
          text = api.read_text()
          marker = 'export type CatalogService = {'
          if marker not in text:
              text += '''\n\nexport type CatalogService = {\n  id: string\n  project_id: string\n  environment_id: string | null\n  server_id: string | null\n  repository_id: string | null\n  name: string\n  description: string\n  service_type: 'web' | 'api' | 'worker' | 'database' | 'queue' | 'cron' | 'other' | string\n  runtime: string | null\n  owner_user_id: string | null\n  endpoint_url: string | null\n  lifecycle_status: 'ACTIVE' | 'PAUSED' | 'ARCHIVED'\n  health_status: string\n  created_at: string\n  updated_at: string\n}\n\nexport type CreateCatalogServiceInput = {\n  name: string\n  description?: string\n  service_type: string\n  runtime?: string | null\n  repository_id?: string | null\n  environment_id?: string | null\n  server_id?: string | null\n  owner_user_id?: string | null\n  endpoint_url?: string | null\n}\n\nexport type UpdateCatalogServiceInput = CreateCatalogServiceInput & {\n  lifecycle_status: CatalogService['lifecycle_status']\n}\n\nexport const getProjectServices = (projectId: string): Promise<CatalogService[]> =>\n  request(`/projects/${projectId}/services`)\n\nexport async function createCatalogService(\n  projectId: string,\n  input: CreateCatalogServiceInput,\n): Promise<CatalogService> {\n  return request(`/projects/${projectId}/services`, {\n    method: 'POST',\n    headers: { 'content-type': 'application/json' },\n    body: JSON.stringify(input),\n  })\n}\n\nexport async function updateCatalogService(\n  projectId: string,\n  serviceId: string,\n  input: UpdateCatalogServiceInput,\n): Promise<CatalogService> {\n  return request(`/projects/${projectId}/services/${serviceId}`, {\n    method: 'PUT',\n    headers: { 'content-type': 'application/json' },\n    body: JSON.stringify(input),\n  })\n}\n\nexport async function deleteCatalogService(projectId: string, serviceId: string): Promise<void> {\n  await request(`/projects/${projectId}/services/${serviceId}`, { method: 'DELETE' })\n}\n'''
          api.write_text(text)

          page = Path('apps/web/app/projects/[projectId]/page.tsx')
          text = page.read_text()
          if "import ServiceCatalogSection from './service-catalog-section'" not in text:
              text = text.replace(
                  "import Link from 'next/link'\n",
                  "import Link from 'next/link'\nimport ServiceCatalogSection from './service-catalog-section'\n",
              )
          if '<ServiceCatalogSection projectId={project.id} />' not in text:
              text = text.replace(
                  '      <h2>Tasks</h2>',
                  '      <ServiceCatalogSection projectId={project.id} />\n\n      <h2>Tasks</h2>',
                  1,
              )
          page.write_text(text)
          PY
          cargo fmt --all
      - name: Commit wiring
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/control-api/src/main.rs services/control-api/src/service_catalog.rs apps/web/lib/api.ts apps/web/app/projects/[projectId]/page.tsx
            git commit -m "feat: wire service catalog V1"
            git push
          fi
