name: Generate initial Payload migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://argus:argus@127.0.0.1:5432/argus
      ARGUS_CONTENT_DB_SCHEMA: argus_content
      PAYLOAD_SECRET: generation-only-payload-secret-00000000000000000
      PAYLOAD_PUBLIC_URL: http://localhost:3001
      ARGUS_CONTENT_SYNC_TOKEN: generation-only-sync-token-0000000000000000000
      PAYLOAD_DB_PUSH: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/payload-production-migrations-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate initial migration
        run: pnpm --filter @argus/content run migrate:create initial_app_data --force-accept-warning
      - name: Verify generated migration files
        shell: bash
        run: |
          set -euo pipefail
          migration_file="$(find apps/content/src/migrations -maxdepth 1 -type f -name '*_initial_app_data.ts' -print -quit)"
          test -n "$migration_file"
          test -s "$migration_file"
          test -s apps/content/src/migrations/index.ts
          grep -F "initial_app_data" apps/content/src/migrations/index.ts
      - name: Generate Payload types and lockfile
        run: |
          pnpm --filter @argus/content run generate:types
          pnpm install --lockfile-only
          pnpm --filter @argus/content run typecheck
      - name: Remove previous merged feature branch
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/agent/payload-app-data-v1 >/dev/null 2>&1; then
            git push origin --delete agent/payload-app-data-v1
          fi
      - name: Commit generated artifacts and remove generator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/bootstrap-payload-migrations.yml
          git add apps/content/src/migrations apps/content/src/payload-types.ts pnpm-lock.yaml
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No migration artifacts were generated"
            exit 1
          fi
          git commit -m "feat: add generated Payload migration artifacts"
          git push origin HEAD:agent/payload-production-migrations-v1
