name: Bootstrap Payload production migrations

on:
  push:
    branches:
      - agent/payload-production-migrations-v1

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: argus
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d argus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/argus
      ARGUS_CONTENT_DB_SCHEMA: argus_content
      PAYLOAD_SECRET: bootstrap-only-payload-secret-0000000000000000
      PAYLOAD_PUBLIC_URL: http://localhost:3001
      ARGUS_CONTENT_SYNC_TOKEN: bootstrap-only-sync-token-000000000000000000
      PAYLOAD_DB_PUSH: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/payload-production-migrations-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate initial Payload migration
        run: |
          set -euo pipefail
          if ! find apps/content/src/migrations -maxdepth 1 -type f -name '*.ts' -print -quit 2>/dev/null | grep -q .; then
            pnpm --filter @argus/content run migrate:create initial_app_data
          fi
      - name: Generate Payload types and lockfile
        run: |
          pnpm --filter @argus/content run generate:types
          pnpm install --lockfile-only
      - name: Apply migration to clean PostgreSQL
        run: pnpm --filter @argus/content run migrate
      - name: Verify isolated schema
        shell: bash
        run: |
          set -euo pipefail
          content_tables="$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='argus_content';")"
          public_tables="$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';")"
          test "$content_tables" -gt 0
          test "$public_tables" -eq 0
          psql "$DATABASE_URL" -Atc "SELECT schema_name FROM information_schema.schemata WHERE schema_name='argus_content';" | grep -Fx argus_content
      - name: Verify migration status and TypeScript
        run: |
          pnpm --filter @argus/content run migrate:status
          pnpm --filter @argus/content run typecheck
          pnpm --filter @argus/web exec tsc --noEmit
      - name: Remove previous merged feature branch
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/agent/payload-app-data-v1 >/dev/null 2>&1; then
            git push origin --delete agent/payload-app-data-v1
          fi
      - name: Commit generated migration artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/bootstrap-payload-migrations.yml
          git add apps/content/src/migrations apps/content/src/payload-types.ts pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No generated migration changes to commit"
            exit 1
          fi
          git commit -m "feat: add Payload production migration"
          git push origin HEAD:agent/payload-production-migrations-v1
