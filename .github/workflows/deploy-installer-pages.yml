name: Deploy installer site

on:
  push:
    branches: [main]
    paths:
      - install.sh
      - apps/installer/**
      - .github/workflows/deploy-installer-pages.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @argus/installer test
      - run: pnpm --filter @argus/installer build
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: >-
          pnpm dlx wrangler@3.90.0 pages deploy apps/installer/dist
          --project-name=argus-installer --branch=main
      - name: Report missing deployment configuration
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Installer site built successfully; add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy it."
