name: Temporary GitHub integration fix
on:
  push:
    branches: [agent/github-integration-v1]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/github-integration-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix visibility and dead code
        run: |
          python3 - <<'PY'
          from pathlib import Path

          github = Path('services/control-api/src/github_integration.rs')
          text = github.read_text()
          text = text.replace('routing::{delete, get, post},', 'routing::{get, post},')
          text = text.replace('struct SyncedRepository {', 'pub(crate) struct SyncedRepository {')
          text = text.replace('pub trait RepositoryProvider {', 'pub(crate) trait RepositoryProvider {')
          github.write_text(text)

          workspace = Path('services/control-api/src/project_workspace.rs')
          text = workspace.read_text()
          text = text.replace('    #[error("permission denied")]\n    PermissionDenied,\n', '')
          text = text.replace('        ProjectWorkspaceError::PermissionDenied => api_error(\n            StatusCode::FORBIDDEN,\n            "PERMISSION_DENIED",\n            "operation not permitted",\n        ),\n', '')
          workspace.write_text(text)
          PY
          cargo fmt --all
      - name: Commit fix
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/control-api/src/github_integration.rs services/control-api/src/project_workspace.rs
            git commit -m "fix: tighten GitHub provider interface"
            git push
          fi
