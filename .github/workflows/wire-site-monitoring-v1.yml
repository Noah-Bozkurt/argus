name: Wire site monitoring V1
on:
  push:
    branches: [agent/site-monitoring-v1]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/site-monitoring-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire module and UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path('services/control-api/src/main.rs')
          text = main.read_text()
          text = text.replace('mod sites_domains;\n', 'mod sites_domains;\nmod site_monitoring;\n', 1)
          text = text.replace('use sites_domains::SiteDomainStore;\n', 'use sites_domains::SiteDomainStore;\nuse site_monitoring::SiteMonitoringStore;\n', 1)
          text = text.replace('    sites_domains: SiteDomainStore,\n', '    sites_domains: SiteDomainStore,\n    site_monitoring: SiteMonitoringStore,\n', 1)
          text = text.replace(
              '    let sites_domains = SiteDomainStore::connect(&config.database_url).await?;\n',
              '    let sites_domains = SiteDomainStore::connect(&config.database_url).await?;\n    let site_monitoring = SiteMonitoringStore::connect(&config.database_url).await?;\n',
              1,
          )
          text = text.replace('        sites_domains,\n        web_api_token:', '        sites_domains,\n        site_monitoring,\n        web_api_token:', 1)
          text = text.replace(
              '        .merge(sites_domains::router())\n        .with_state(state);',
              '        .merge(sites_domains::router())\n        .merge(site_monitoring::router())\n        .with_state(state);',
              1,
          )
          main.write_text(text)

          page = Path('apps/web/app/projects/[projectId]/page.tsx')
          text = page.read_text()
          text = text.replace(
              "import SitesDomainsSection from './sites-domains-section'\n",
              "import SitesDomainsSection from './sites-domains-section'\nimport SiteMonitoringSection from './site-monitoring-section'\n",
              1,
          )
          text = text.replace(
              '      <SitesDomainsSection projectId={project.id} />',
              '      <SitesDomainsSection projectId={project.id} />\n\n      <SiteMonitoringSection projectId={project.id} />',
              1,
          )
          page.write_text(text)
          PY
          cargo fmt --all
          git rm .github/workflows/wire-site-monitoring-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/control-api/src/main.rs services/control-api/src/site_monitoring.rs apps/web/app/projects/[projectId]/page.tsx
          git commit -m "feat: wire site monitoring V1"
          git push
