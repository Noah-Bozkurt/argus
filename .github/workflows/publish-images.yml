name: Publish Argus Images

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: argus-images-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: argus-web
            dockerfile: deploy/docker/web.Dockerfile
          - image: argus-control-api
            dockerfile: deploy/docker/control-api.Dockerfile
          - image: argus-worker
            dockerfile: deploy/docker/worker.Dockerfile
          - image: argus-content
            dockerfile: deploy/docker/content.Dockerfile
          - image: argus-host-tools
            dockerfile: deploy/docker/host-tools.Dockerfile
    steps:
      - name: Check out tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/noah-bozkurt/${{ matrix.image }}:main
            ghcr.io/noah-bozkurt/${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=${{ github.event.workflow_run.repository.html_url }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=${{ github.event.workflow_run.head_sha }}
