name: Publish Argus release (disabled - Buildkite trial)

# Automatic GitHub Actions releases are temporarily disabled while Argus evaluates Buildkite.
# The previous workflow remains available in Git history for an easy rollback.
on:
  workflow_dispatch:

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "GitHub Actions release publishing is disabled; use Buildkite."
