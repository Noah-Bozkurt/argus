name: Publish Argus Images

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: argus-images-main
  cancel-in-progress: false

jobs:
  publish-immutable-images:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: argus-web
            dockerfile: deploy/docker/web.Dockerfile
          - image: argus-content
            dockerfile: deploy/docker/content.Dockerfile
          - image: argus-control-api
            dockerfile: deploy/docker/control-api.Dockerfile
          - image: argus-worker
            dockerfile: deploy/docker/worker.Dockerfile
          - image: argus-host-tools
            dockerfile: deploy/docker/host-tools.Dockerfile
    steps:
      - name: Check out tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          tags: ghcr.io/noah-bozkurt/${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=${{ github.event.workflow_run.repository.html_url }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=${{ github.event.workflow_run.head_sha }}

  verify-published-artifacts:
    name: Verify immutable release
    needs: publish-immutable-images
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify complete SHA-tagged release
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for image in argus-web argus-content argus-control-api argus-worker argus-host-tools
          do
            echo "Verifying ${image}:${TESTED_SHA}"
            docker buildx imagetools inspect \
              "ghcr.io/noah-bozkurt/${image}:${TESTED_SHA}" >/dev/null
          done

  promote-release:
    name: Promote verified release
    needs: verify-published-artifacts
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote application images
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for image in argus-web argus-content argus-control-api argus-worker
          do
            echo "Promoting ${image}:${TESTED_SHA} to main"
            docker buildx imagetools create \
              --tag "ghcr.io/noah-bozkurt/${image}:main" \
              "ghcr.io/noah-bozkurt/${image}:${TESTED_SHA}"
          done

      - name: Promote host-tools release pointer last
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag ghcr.io/noah-bozkurt/argus-host-tools:main \
            "ghcr.io/noah-bozkurt/argus-host-tools:${TESTED_SHA}"

      - name: Verify promoted release tags
        run: |
          set -euo pipefail
          for image in argus-web argus-content argus-control-api argus-worker argus-host-tools
          do
            docker buildx imagetools inspect \
              "ghcr.io/noah-bozkurt/${image}:main" >/dev/null
          done
