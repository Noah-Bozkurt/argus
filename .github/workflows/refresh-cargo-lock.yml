name: Refresh Cargo lockfile once

on:
  push:
    branches:
      - agent/server-test-deployment-v1

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/server-test-deployment-v1
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate lockfile
        run: cargo generate-lockfile
      - name: Remove one-shot workflow and commit
        run: |
          set -euo pipefail
          git rm .github/workflows/refresh-cargo-lock.yml
          git add Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Cargo lockfile"
          git push origin HEAD:agent/server-test-deployment-v1
