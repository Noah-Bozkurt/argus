name: Apply platform foundation

on:
  push:
    branches:
      - feat/platform-libraries-foundation
    paths:
      - .github/workflows/apply-platform-foundation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/platform-libraries-foundation

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Apply source changes
        run: python3 scripts/bootstrap-platform-foundation.py

      - name: Validate Rust and refresh Cargo.lock
        run: |
          cargo fmt --all
          cargo check -p control-api
          cargo test -p control-api

      - name: Refresh pnpm lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Generate typed API contract
        run: bash scripts/generate-api-contracts.sh

      - name: Typecheck web
        run: pnpm --filter @argus/web exec tsc --noEmit

      - name: Commit validated foundation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/bootstrap-platform-foundation.py
          rm -f .github/workflows/bootstrap-platform-libraries.yml
          rm -f .github/workflows/apply-platform-foundation.yml
          git add -A
          git diff --cached --check
          git commit -m 'feat: add typed platform library foundation'
          git push origin HEAD:feat/platform-libraries-foundation
