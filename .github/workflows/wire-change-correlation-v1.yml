name: Wire change correlation V1
on:
  push:
    branches: [agent/change-correlation-v1]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/change-correlation-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire store route and incident detail
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path('services/control-api/src/main.rs')
          text = main.read_text()
          text = text.replace('mod dependency_graph;\n', 'mod change_correlation;\nmod dependency_graph;\n', 1)
          text = text.replace('use dependency_graph::DependencyGraphStore;\n', 'use change_correlation::ChangeCorrelationStore;\nuse dependency_graph::DependencyGraphStore;\n', 1)
          text = text.replace('    dependency_graph: DependencyGraphStore,\n', '    change_correlation: ChangeCorrelationStore,\n    dependency_graph: DependencyGraphStore,\n', 1)
          text = text.replace(
              '    let dependency_graph = DependencyGraphStore::connect(&config.database_url).await?;\n',
              '    let change_correlation = ChangeCorrelationStore::connect(&config.database_url).await?;\n    let dependency_graph = DependencyGraphStore::connect(&config.database_url).await?;\n',
              1,
          )
          text = text.replace('        dependency_graph,\n', '        change_correlation,\n        dependency_graph,\n', 1)
          text = text.replace(
              '        .merge(incidents::router())\n        .with_state(state);',
              '        .merge(incidents::router())\n        .merge(change_correlation::router())\n        .with_state(state);',
              1,
          )
          main.write_text(text)

          page = Path('apps/web/app/projects/[projectId]/incidents/[incidentId]/page.tsx')
          text = page.read_text()
          text = text.replace(
              "import { addIncidentNoteAction, updateIncidentStatusAction } from '../../incident-actions'\n",
              "import { addIncidentNoteAction, updateIncidentStatusAction } from '../../incident-actions'\nimport IncidentCorrelationSection from './correlation-section'\n",
              1,
          )
          text = text.replace(
              '      <h2>Add timeline note</h2>',
              '      <IncidentCorrelationSection projectId={params.projectId} incidentId={incident.id} />\n\n      <h2>Add timeline note</h2>',
              1,
          )
          page.write_text(text)
          PY
          cargo fmt --all
          git rm .github/workflows/wire-change-correlation-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/control-api/src/main.rs services/control-api/src/change_correlation.rs apps/web/app/projects/[projectId]/incidents/[incidentId]/page.tsx
          git commit -m "feat: wire change correlation V1"
          git push
