name: Temporary GitHub delete route fix
on:
  push:
    branches: [agent/github-integration-v1]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/github-integration-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Restore delete routing import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('services/control-api/src/github_integration.rs')
          text = path.read_text().replace('routing::{get, post},', 'routing::{delete, get, post},')
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Commit fix
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/control-api/src/github_integration.rs
            git commit -m "fix: restore GitHub delete route import"
            git push
          fi
