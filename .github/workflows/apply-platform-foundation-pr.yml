name: Validate and apply platform foundation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-platform-foundation-pr.yml
      - scripts/bootstrap-platform-foundation.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Apply source changes
        run: python3 scripts/bootstrap-platform-foundation.py

      - name: Keep response-only snapshot fields required in OpenAPI
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('crates/protocol/src/lib.rs')
          source = path.read_text()
          start = source.index('pub struct SystemSnapshot {')
          end = source.index('\n}', start)
          block = source[start:end]
          marker = '#[serde(default)]'
          required = '#[cfg_attr(feature = "openapi", schema(required = true))]\n    #[serde(default)]'
          block = block.replace(marker, required)
          source = source[:start] + block + source[end:]
          path.write_text(source)
          PY

      - name: Validate Rust and refresh Cargo.lock
        run: |
          cargo fmt --all
          cargo check -p control-api
          cargo test -p control-api

      - name: Refresh pnpm lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Generate typed API contract
        run: bash scripts/generate-api-contracts.sh

      - name: Typecheck web
        run: pnpm --filter @argus/web exec tsc --noEmit

      - name: Commit validated foundation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/bootstrap-platform-foundation.py
          rm -f .github/workflows/bootstrap-platform-libraries.yml
          rm -f .github/workflows/apply-platform-foundation.yml
          rm -f .github/workflows/apply-platform-foundation-pr.yml
          git add -A
          git diff --cached --check
          git commit -m 'feat: add typed platform library foundation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
