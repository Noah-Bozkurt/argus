name: Validate and apply Bollard helper runtime

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/helper/**'
      - 'crates/agent/**'
      - 'crates/protocol/**'
      - 'scripts/bootstrap-bollard-helper.py'
      - '.github/workflows/bootstrap-bollard-helper.yml'
      - 'docs/development.md'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/bollard-helper-runtime'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bollard-helper-runtime
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply source changes
        run: python3 scripts/bootstrap-bollard-helper.py
      - name: Validate Bollard helper runtime
        run: |
          cargo fmt --all
          cargo check -p helper -p agent -p protocol
          cargo test -p helper -p agent -p protocol
      - name: Commit validated migration
        run: |
          rm scripts/bootstrap-bollard-helper.py .github/workflows/bootstrap-bollard-helper.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'feat(helper): migrate Docker runtime to Bollard'
          git push origin HEAD:feat/bollard-helper-runtime
