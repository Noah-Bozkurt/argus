name: Validate and apply Bollard progress

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-bollard-progress.yml
      - scripts/bootstrap-bollard-progress.py
      - crates/cli/Cargo.toml
      - crates/cli/src/docker.rs

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply source changes
        run: python3 scripts/bootstrap-bollard-progress.py

      - name: Validate Rust and updater syntax
        run: |
          cargo fmt --all
          cargo check -p cli
          cargo test -p cli
          bash -n scripts/update-first-test.sh

      - name: Commit validated Bollard integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/bootstrap-bollard-progress.py
          rm -f .github/workflows/apply-bollard-progress.yml
          git add -A
          git diff --cached --check
          git commit -m 'feat(cli): add Bollard image pull progress'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
