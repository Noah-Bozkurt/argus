name: Route CI runners migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/route-ci-runners-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Route fork pull requests away from self-hosted runners
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = '    runs-on: [self-hosted, linux, x64]'
          new = "    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'argus' }}"

          if text.count(old) != 3:
              raise SystemExit(f'expected exactly 3 self-hosted job declarations, found {text.count(old)}')

          # validate and deployment-acceptance can run for pull requests. Keep the
          # main-only release gate pinned to the self-hosted Argus runners.
          text = text.replace(old, new, 2)
          path.write_text(text)
          PY

          grep -Fq "runs-on: \${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'argus' }}" .github/workflows/ci.yml
          [[ "$(grep -Fc 'runs-on: [self-hosted, linux, x64]' .github/workflows/ci.yml)" -eq 1 ]]

      - name: Commit migration and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/route-ci-runners-migration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml .github/workflows/route-ci-runners-migration.yml
          git commit -m 'fix(ci): isolate fork PRs from self-hosted runners'
          git push origin HEAD:main
