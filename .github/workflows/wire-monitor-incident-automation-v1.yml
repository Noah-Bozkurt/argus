name: Wire Monitoring Incident Automation V1
on:
  push:
    branches: [agent/monitor-incident-automation-v1]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/monitor-incident-automation-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire automation module and project UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('services/control-api/src/main.rs')
          text = main.read_text()
          if 'mod incident_automation;' not in text:
              text = text.replace('mod incidents;\n', 'mod incident_automation;\nmod incidents;\n', 1)
          if 'use incident_automation::IncidentAutomationStore;' not in text:
              text = text.replace('use github_integration::{GitHubIntegrationStore, GitHubProvider};\n', 'use github_integration::{GitHubIntegrationStore, GitHubProvider};\nuse incident_automation::IncidentAutomationStore;\n', 1)
          if '    incident_automation: IncidentAutomationStore,\n' not in text:
              text = text.replace('    incidents: IncidentStore,\n', '    incident_automation: IncidentAutomationStore,\n    incidents: IncidentStore,\n', 1)
          if 'let incident_automation = IncidentAutomationStore::connect' not in text:
              text = text.replace('    let notifications = NotificationStore::connect(&config.database_url).await?;\n', '    let notifications = NotificationStore::connect(&config.database_url).await?;\n    let incident_automation = IncidentAutomationStore::connect(&config.database_url).await?;\n', 1)
          if '        incident_automation,\n' not in text:
              text = text.replace('        notifications,\n        incidents,\n', '        notifications,\n        incident_automation,\n        incidents,\n', 1)
          if '.merge(incident_automation::router())' not in text:
              text = text.replace('        .merge(incidents::router())\n', '        .merge(incident_automation::router())\n        .merge(incidents::router())\n', 1)
          main.write_text(text)

          page = Path('apps/web/app/projects/[projectId]/page.tsx')
          text = page.read_text()
          if "import IncidentAutomationSection from './incident-automation-section'" not in text:
              text = text.replace("import MonitorSchedulesSection from './monitor-schedules-section'\n", "import MonitorSchedulesSection from './monitor-schedules-section'\nimport IncidentAutomationSection from './incident-automation-section'\n", 1)
          if '<IncidentAutomationSection projectId={project.id} />' not in text:
              text = text.replace('      <MonitorSchedulesSection projectId={project.id} />', '      <MonitorSchedulesSection projectId={project.id} />\n\n      <IncidentAutomationSection projectId={project.id} />', 1)
          page.write_text(text)
          PY
          cargo fmt --all
          git rm .github/workflows/wire-monitor-incident-automation-v1.yml .argus-monitor-incident-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/control-api/src/main.rs services/control-api/src/incident_automation.rs services/control-api/src/job_execution.rs apps/web/app/projects/[projectId]/page.tsx
          git commit -m "feat: wire Monitoring Incident automation V1"
          git push
