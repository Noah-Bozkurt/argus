name: Wire deployments releases V1
on:
  push:
    branches: [agent/deployments-releases-v1]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deployments-releases-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire control API and web
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('services/control-api/src/main.rs')
          text = main.read_text()
          if 'mod deployments_releases;' not in text:
              text = text.replace('mod desired_state;\n', 'mod desired_state;\nmod deployments_releases;\n')
          if 'use deployments_releases::DeploymentReleaseStore;' not in text:
              text = text.replace(
                  'use desired_state::{DesiredState, DesiredStateError, DesiredStateStore};\n',
                  'use desired_state::{DesiredState, DesiredStateError, DesiredStateStore};\nuse deployments_releases::DeploymentReleaseStore;\n',
              )
          if '    deployments_releases: DeploymentReleaseStore,\n' not in text:
              text = text.replace(
                  '    desired_state: DesiredStateStore,\n',
                  '    desired_state: DesiredStateStore,\n    deployments_releases: DeploymentReleaseStore,\n',
              )
          if 'let deployments_releases = DeploymentReleaseStore::connect' not in text:
              text = text.replace(
                  '    let desired_state = DesiredStateStore::connect(&config.database_url).await?;\n',
                  '    let desired_state = DesiredStateStore::connect(&config.database_url).await?;\n    let deployments_releases = DeploymentReleaseStore::connect(&config.database_url).await?;\n',
              )
          if '        deployments_releases,\n' not in text:
              text = text.replace(
                  '        desired_state,\n        environments,\n',
                  '        desired_state,\n        deployments_releases,\n        environments,\n',
              )
          if '.merge(deployments_releases::router())' not in text:
              text = text.replace(
                  '        .merge(environments::router())\n        .with_state(state);',
                  '        .merge(environments::router())\n        .merge(deployments_releases::router())\n        .with_state(state);',
              )
          main.write_text(text)

          api = Path('apps/web/lib/api.ts')
          text = api.read_text()
          if 'export type DeploymentStatus =' not in text:
              text += r'''

export type DeploymentStatus =
  | 'QUEUED'
  | 'RUNNING'
  | 'SUCCEEDED'
  | 'FAILED'
  | 'CANCELLED'
  | 'ROLLED_BACK'

export type Deployment = {
  id: string
  project_id: string
  service_id: string
  environment_id: string
  repository_id: string | null
  source_commit_sha: string | null
  source_version: string | null
  provider: string
  status: DeploymentStatus
  deployment_url: string | null
  error_summary: string | null
  notes: string
  previous_deployment_id: string | null
  rollback_of_deployment_id: string | null
  triggered_by: string
  started_at: string | null
  finished_at: string | null
  created_at: string
  updated_at: string
}

export type ReleaseStatus = 'DRAFT' | 'READY' | 'RELEASED' | 'FAILED' | 'ROLLED_BACK'

export type ReleaseComponent = {
  id: string
  release_id: string
  service_id: string
  deployment_id: string | null
  version: string | null
  commit_sha: string | null
  created_at: string
}

export type ProjectRelease = {
  id: string
  project_id: string
  version: string
  name: string
  notes: string
  status: ReleaseStatus
  created_by: string
  released_at: string | null
  created_at: string
  updated_at: string
  components: ReleaseComponent[]
}

export type DeploymentReleaseView = {
  deployments: Deployment[]
  releases: ProjectRelease[]
}

export type CreateDeploymentInput = {
  service_id: string
  environment_id: string
  repository_id?: string | null
  source_commit_sha?: string | null
  source_version?: string | null
  provider?: string
  notes?: string
  rollback_of_deployment_id?: string | null
}

export type CreateReleaseInput = {
  version: string
  name: string
  notes?: string
}

export type AddReleaseComponentInput = {
  service_id: string
  deployment_id?: string | null
  version?: string | null
  commit_sha?: string | null
}

export const getDeploymentReleaseView = (projectId: string): Promise<DeploymentReleaseView> =>
  request(`/projects/${projectId}/deployments-releases`)

export async function createDeployment(
  projectId: string,
  input: CreateDeploymentInput,
): Promise<Deployment> {
  return request(`/projects/${projectId}/deployments`, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(input),
  })
}

export async function updateDeploymentStatus(
  projectId: string,
  deploymentId: string,
  status: DeploymentStatus,
  deploymentUrl: string | null,
  errorSummary: string | null,
): Promise<Deployment> {
  return request(`/projects/${projectId}/deployments/${deploymentId}/status`, {
    method: 'PUT',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({
      status,
      deployment_url: deploymentUrl,
      error_summary: errorSummary,
    }),
  })
}

export async function createRelease(
  projectId: string,
  input: CreateReleaseInput,
): Promise<ProjectRelease> {
  return request(`/projects/${projectId}/releases`, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(input),
  })
}

export async function addReleaseComponent(
  projectId: string,
  releaseId: string,
  input: AddReleaseComponentInput,
): Promise<ProjectRelease> {
  return request(`/projects/${projectId}/releases/${releaseId}/components`, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(input),
  })
}

export async function updateReleaseStatus(
  projectId: string,
  releaseId: string,
  status: ReleaseStatus,
): Promise<ProjectRelease> {
  return request(`/projects/${projectId}/releases/${releaseId}/status`, {
    method: 'PUT',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ status }),
  })
}
'''
          api.write_text(text)

          page = Path('apps/web/app/projects/[projectId]/page.tsx')
          text = page.read_text()
          if "import DeploymentsReleasesSection from './deployments-releases-section'" not in text:
              text = text.replace(
                  "import EnvironmentsSection from './environments-section'\n",
                  "import EnvironmentsSection from './environments-section'\nimport DeploymentsReleasesSection from './deployments-releases-section'\n",
              )
          if '<DeploymentsReleasesSection projectId={project.id} />' not in text:
              text = text.replace(
                  '      <ServiceCatalogSection projectId={project.id} />',
                  '      <ServiceCatalogSection projectId={project.id} />\n\n      <DeploymentsReleasesSection projectId={project.id} />',
                  1,
              )
          page.write_text(text)
          PY
          cargo fmt --all
          git rm .github/workflows/wire-deployments-releases-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/control-api/src/main.rs services/control-api/src/deployments_releases.rs apps/web/lib/api.ts apps/web/app/projects/[projectId]/page.tsx
          git commit -m "feat: wire deployments and releases V1"
          git push
