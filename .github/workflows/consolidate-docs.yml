name: Consolidate Argus documentation

on:
  push:
    branches:
      - docs/closed-source-documentation-refresh

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/closed-source-documentation-refresh
          fetch-depth: 0
      - name: Remove superseded milestone docs and lock Rust packages from publishing
        shell: bash
        run: |
          set -euo pipefail

          find docs -maxdepth 1 -type f -name '*.md' \
            ! -name 'README.md' \
            ! -name 'architecture.md' \
            ! -name 'projects-and-delivery.md' \
            ! -name 'operations.md' \
            ! -name 'security-and-recovery.md' \
            ! -name 'content-platform.md' \
            ! -name 'development.md' \
            ! -name 'roadmap.md' \
            -delete

          python - <<'PY'
          from pathlib import Path

          for path in [
              Path('services/control-api/Cargo.toml'),
              Path('services/worker/Cargo.toml'),
              Path('crates/agent/Cargo.toml'),
              Path('crates/cli/Cargo.toml'),
              Path('crates/helper/Cargo.toml'),
              Path('crates/protocol/Cargo.toml'),
              Path('crates/system/Cargo.toml'),
              Path('crates/common/Cargo.toml'),
          ]:
              text = path.read_text()
              if 'publish = false' in text:
                  continue
              marker = 'edition = "2024"\n'
              if marker not in text:
                  raise SystemExit(f'edition marker missing in {path}')
              path.write_text(text.replace(marker, marker + 'publish = false\n', 1))
          PY

          git rm .github/workflows/consolidate-docs.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'docs: consolidate repository documentation'
          git push origin HEAD:docs/closed-source-documentation-refresh
