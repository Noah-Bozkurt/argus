name: Wire rebased notifications V1
on:
  push:
    branches: [agent/notifications-v1]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/notifications-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire notifications without dropping existing modules
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('services/control-api/src/main.rs')
          text = main.read_text()
          if 'mod notifications;' not in text:
              text = text.replace('mod maintenance;\n', 'mod maintenance;\nmod notifications;\n', 1)
          if 'use notifications::NotificationStore;' not in text:
              text = text.replace('use maintenance::MaintenanceStore;\n', 'use maintenance::MaintenanceStore;\nuse notifications::NotificationStore;\n', 1)
          if '    notifications: NotificationStore,\n' not in text:
              text = text.replace('    maintenance: MaintenanceStore,\n', '    maintenance: MaintenanceStore,\n    notifications: NotificationStore,\n', 1)
          if 'let notifications = NotificationStore::connect' not in text:
              text = text.replace('    let maintenance = MaintenanceStore::connect(&config.database_url).await?;\n', '    let maintenance = MaintenanceStore::connect(&config.database_url).await?;\n    let notifications = NotificationStore::connect(&config.database_url).await?;\n', 1)
          if '        notifications,\n' not in text:
              text = text.replace('        maintenance,\n        incidents,\n', '        maintenance,\n        notifications,\n        incidents,\n', 1)
          if '.merge(notifications::router())' not in text:
              text = text.replace('        .merge(status_pages::router())\n        .with_state(state);', '        .merge(status_pages::router())\n        .merge(notifications::router())\n        .with_state(state);', 1)
          main.write_text(text)

          page = Path('apps/web/app/page.tsx')
          text = page.read_text()
          if 'href="/notifications"' not in text:
              text = text.replace('        <li><Link href="/projects">Projects</Link></li>', '        <li><Link href="/projects">Projects</Link></li>\n        <li><Link href="/notifications">Notifications</Link></li>', 1)
          page.write_text(text)
          PY
          cargo fmt --all
          git rm .github/workflows/wire-notifications-rebase.yml .argus-notifications-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/control-api/src/main.rs services/control-api/src/notifications.rs apps/web/app/page.tsx
          git commit -m "feat: wire notifications V1 after readiness"
          git push
